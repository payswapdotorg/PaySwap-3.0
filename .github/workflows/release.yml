# PaySwap 3.0 — Release (P9-B)
#
# Tag-triggered distribution build for PaySwap Desktop on Ubuntu x86_64.
# Builds the REAL installers from a clean checkout and attaches them,
# together with SHA-256 checksums, to the GitHub Release for the tag.
#
# Laws (spec/productization/PRODUCT-IDENTITY.md §1 + §6):
#   - the product version lives in packages/desktop/package.json (PaySwap-own
#     semver, starts at 1.0.0); a release tag MUST be `v<that version>`;
#   - artifact names are the electron-builder deb/AppImage conventions:
#     PaySwap_<version>_amd64.deb and PaySwap-<version>.AppImage;
#   - no secrets: the default GITHUB_TOKEN with contents:write is enough.
#
# What this workflow deliberately does NOT do:
#   - no macOS/Windows targets and no signing (documented P9-B gaps);
#   - no auto-update feed publication (no PaySwap feed exists; the packaged
#     updater stays inert until the operator configures one).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    env:
      # Production identity + production backend: the release artifacts are
      # `PaySwap` (never the Preview flavor, never a _TEST suffix).
      ZCODE_ENV: production
      # The .deb/AppImage never embed mock-cdn remote assets (dev-only
      # offline cache for SSH/WSL remote agents; packaged apps fetch remote
      # runtimes from the operator CDN at runtime instead). Skipping the
      # remote-asset download stage keeps the release build honest and fast.
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    steps:
      - name: Checkout (full history for build metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve release version (tag without the leading v)
        if: github.ref_type == 'tag'
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify the tag matches the desktop product version
        if: github.ref_type == 'tag'
        run: |
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "v${DESKTOP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the desktop product version v${DESKTOP_VERSION}" >&2
            exit 1
          fi
          if [ "${RELEASE_VERSION}" != "${DESKTOP_VERSION}" ]; then
            echo "::error::resolved release version ${RELEASE_VERSION} does not match the desktop product version ${DESKTOP_VERSION}" >&2
            exit 1
          fi

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build PaySwap Desktop (runtime assets + production bundles)
        run: pnpm --filter @payswap/desktop build

      - name: Package Linux installers (.deb + AppImage)
        # --config is explicit: electron-builder 26 does not reliably auto-discover
        # the ESM config (top-level await) — implicit discovery silently falls back
        # to defaults (scoped package names, no maintainer) and fails at fpm.
        run: pnpm --filter @payswap/desktop run pack:linux

      - name: List artifacts and compute SHA-256 checksums
        run: |
          cd packages/desktop/dist
          ls -la
          sha256sum PaySwap_*_amd64.deb PaySwap-*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts (workflow retention)
        uses: actions/upload-artifact@v4
        with:
          name: payswap-desktop-linux
          if-no-files-found: error
          path: |
            packages/desktop/dist/PaySwap_*_amd64.deb
            packages/desktop/dist/PaySwap-*.AppImage
            packages/desktop/dist/SHA256SUMS.txt

      - name: Attach installers + checksums to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            packages/desktop/dist/PaySwap_*_amd64.deb
            packages/desktop/dist/PaySwap-*.AppImage
            packages/desktop/dist/SHA256SUMS.txt
          body: |
            PaySwap Desktop ${{ github.ref_name }} — Ubuntu x86_64 (amd64) installers.

            **Install (Ubuntu 20.04+/Debian 11+, glibc ≥ 2.28):**

            ```
            sudo apt install ./PaySwap_${{ env.RELEASE_VERSION }}_amd64.deb
            ```

            Or download `PaySwap-${{ env.RELEASE_VERSION }}.AppImage`, make it executable and run it (needs FUSE on Ubuntu 24.04+: `sudo apt install libfuse2t64`).

            Verify integrity with `sha256sum -c SHA256SUMS.txt` (see the checksums asset).

            **Build provenance**

            - Tag: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Built from a clean checkout with the frozen lockfile (`pnpm install --frozen-lockfile`), the full desktop production build (`pnpm --filter @payswap/desktop build`), and `electron-builder --linux deb appimage --publish never`.
            - Signing: Linux installers are not signed (no Linux signing requirement). macOS/Windows builds and their signing/notarization remain out of scope for this release channel.

  # The clean-install verification (PRODUCT-IDENTITY §6 gate 3): downloads
  # the PUBLISHED release assets (checksum-verified against the attached
  # SHA256SUMS), dpkg-installs the .deb on a clean ubuntu-latest runner,
  # asserts the installed product identity (Name=PaySwap desktop entry,
  # icon, exec binary, package), LAUNCHES the app under Xvfb and asserts a
  # PaySwap-branded window exists, then removes the package. The receipt is
  # uploaded as the evidence artifact. This job exists because the v1.0.0
  # release shipped a launch-blocking force-update defect that only a real
  # GUI launch could catch — packaging tests alone proved nothing.
  install-verify:
    needs: desktop-linux
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (the install-verify runner)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install launch-verification tooling (Xvfb + xdotool)
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool

      - name: Run the install-verification runner against the published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node packages/journey-verification/install/install-verify.mjs \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --launch

      - name: Upload the install-verify receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-verify-receipt
          path: packages/journey-verification/install/.cache-install-verify/install-verify-receipt.json
          if-no-files-found: warn
