version: 1
architecture: payswap-3.0
rule: domain-authority-isolation

layers:
  platform:
    owner: platform
    examples: [rpc, transport, session, client, web, desktop, cli, telemetry, browser, plugins]
    # ADR-0001 (2026-10-11, ACCEPTED): platform-internal composition + composition
    # roots accepted by additive annotation. See
    # docs/architecture-governance/adr/ADR-0001-platform-internal-composition.md
    may_depend_on: [contracts, platform]
    must_not_depend_on: [financial-implementation]
  contracts:
    owner: architecture
    examples: [shared-protocols, surface-contracts]
    # ADR-0002 (2026-10-11, ACCEPTED): contracts may compose contracts (floor
    # of the graph preserved — nothing outside contracts is allowed). See
    # docs/architecture-governance/adr/ADR-0002-contracts-compose-contracts.md
    may_depend_on: [contracts]
  economic:
    owner: economic
    examples: [goals, intents, execution-graph, strategy, opportunities]
    may_depend_on: [contracts]
    must_not_depend_on: [ui, model-runtime, provider-sdk]
  trust:
    owner: trust
    examples: [principals, mandates, delegation, approvals, credentials]
    may_depend_on: [contracts]
  capability:
    owner: network
    examples: [capability-definition, provider-implementation, connected-instance, observation, certification]
    may_depend_on: [contracts, trust]
  financial:
    owner: financial
    examples: [money, obligations, clearing, netting, settlement, reconciliation, evidence]
    may_depend_on: [contracts, trust, capability]
    must_not_depend_on: [ui, model-runtime, lab]
  rails:
    owner: network
    examples: [fiat, payment, fx, onchain, future]
    may_depend_on: [contracts, capability, trust, financial]
    must_not_depend_on: [ui, model-runtime]
  intelligence:
    owner: intelligence
    examples: [agents, organizations, director, lab, optimization]
    may_depend_on: [economic, capability, contracts]
    cannot_authorize_financial_effects: true
  security:
    owner: security
    examples: [policy, threat-intel, deterministic-gates, security-epoch]
    may_depend_on: [trust, capability, contracts]
    cannot_downgrade_block: true
  experience:
    owner: experience
    examples: [surface, web-ui, desktop-ui, mobile, extension]
    may_depend_on: [contracts]
    must_not_own_financial_truth: true

authority:
  financial_truth: financial
  delegated_power: trust
  capability_certification: capability
  hard_constraints: security
  intelligence_proposals: intelligence
  application_permission: platform

dependency_rules:
  forbid_cycles: true
  forbid_deep_imports: true
  domain_contracts_framework_free: true
  platform_permission_not_financial_authorization: true
  no_parallel_financial_authority: true

# ---------------------------------------------------------------------------
# ADDITIVE ANNOTATIONS (P0-W2, worker-2) — declared-layer mapping for the
# inherited workspace packages as of base e40f2b9.
#
# Scope law: this block ONLY adds package -> declared-layer declarations.
# It does not modify any layer rule, may_depend_on, must_not_depend_on,
# authority, or dependency_rules entry above. Keys are repo-relative package
# directories; the validator resolves each directory to its package.json name.
# Per-package mapping rationale: docs/architecture-governance/LAYER-MAPPING.md.
# Packages without an annotation are reported UNMAPPED (never guessed).
# ---------------------------------------------------------------------------
package_layers:
  # --- contracts layer (provider-neutral shared protocols/types) ---
  packages/shared: contracts
  apps/zcode-cli/packages/contracts: contracts
  apps/zcode-cli/packages/shared-types: contracts
  # --- platform layer (ZCode substrate: rpc/transport/session/runtime/
  #     model providers/web/desktop/cli/telemetry/browser/plugins tooling) ---
  packages/rpc: platform
  packages/provider: platform
  packages/provider-node: platform
  packages/model-option-map: contracts # ADR-0003 (2026-10-11): leaf, dep-free, deterministic typed surface — contracts-grade
  packages/services: platform
  packages/client: platform
  packages/server: platform
  packages/zcode-server-cli: platform
  packages/ui: platform
  packages/web: platform
  packages/desktop: platform
  packages/formal-proof: platform
  packages/zcode-cua: platform
  apps/zcode-cli: platform
  apps/zcode-cli/packages/adapters: platform
  apps/zcode-cli/packages/bootstrap: platform
  apps/zcode-cli/packages/browser-use-plugin: platform
  apps/zcode-cli/packages/cli: platform
  apps/zcode-cli/packages/core: platform
  apps/zcode-cli/packages/debug: platform
  apps/zcode-cli/packages/dynamic-workflow: platform
  apps/zcode-cli/packages/dynamic-workflow-runtime: platform
  apps/zcode-cli/packages/i18n: platform
  apps/zcode-cli/packages/node-repl-host: platform
  apps/zcode-cli/packages/swift-bridge: platform
  apps/zcode-cli/packages/telemetry: platform
  apps/zcode-cli/packages/tui: platform
  apps/zcode-cli/tools/prompt-trajectory: platform
  apps/zcode-cli/tools/typescript: platform
  # PaySwap domain packages (P1 landings; TL acceptance integration):
  packages/trust: trust
  packages/economic: economic
  packages/protocol: financial
  # P2 landings (TL acceptance integration; layer mapping per composition
  # notes: provider-runtime = rails — adapters/connection/execution bridge
  # to external providers; may_depend_on [contracts, capability, trust,
  # financial], zero sibling imports in v1):
  packages/provider-runtime: rails
  # surface = framework-independent Surface/API contracts + discovery
  # projections — contracts-grade (provider-neutral types only; UI remains
  # a projection and cannot own financial truth; P7 experience consumers
  # are outside this package):
  packages/surface: contracts
  # capability = capability fabric (P2-W1 acceptance integration): the
  # CapabilityDefinition -> ProviderImplementation -> ConnectedCapabilityInstance
  # -> CapabilityObservation chain + ProviderStateEnvelope + certification +
  # execution modes + corridor-aware eligibility discovery projection. Layer
  # 'capability' (may_depend_on [contracts, trust]); package pinned as a
  # RUNTIME LEAF — zero runtime deps; the ONE sibling import is TYPE-ONLY
  # @payswap/trust via tsconfig paths (accepted P1-W2 pattern):
  packages/capability: capability
  # GOV-W1 reconciliation (2026-10-19): lanes merged on main (R1/R2/P7/P6/R3
  # waves) whose package_layers annotations were never added — audit finding
  # TL-AUDIT-2026-10-19.md §3.3 (11 unmapped of 49). Layer per each lane's
  # own spec (the authority); full per-package rationale appended to
  # docs/architecture-governance/LAYER-MAPPING.md. Additive-only: no layer
  # rule, may_depend_on, must_not_depend_on, authority or dependency_rules
  # entry above is modified.
  packages/agents: intelligence # spec/agents/AGENT-MODEL.md "Layer law" (type-only @payswap/trust wire pins; R3 honest, ADR-0004)
  packages/execution-graph: economic # spec/execution-graph/EXECUTION-GRAPH.md "Layer law" (type-only pins to economic/protocol/capability; R3 honest, ADR-0004)
  packages/zcode-bridge: platform # spec/zcode-bridge/ZCODE-BRIDGE.md ("treat as platform")
  packages/onchain-domain: rails # spec/onchain-domain/ONCHAIN-DOMAIN.md "Layer law"
  packages/onchain-adapters: rails # spec/onchain-adapters/ONCHAIN-ADAPTERS.md "Layer law" (leaf-in-flight, zero sibling imports)
  packages/onchain-extensions: rails # spec/onchain-extensions/ONCHAIN-EXTENSIONS.md "Layer law (R3-W2)"
  packages/onchain-security: security # spec/onchain-security/ONCHAIN-SECURITY.md (layer security, cannot_downgrade_block)
  packages/route-compiler: intelligence # spec/route-compiler/ROUTE-COMPILER.md §2 (v1 hermetic, zero sibling imports)
  packages/opportunities: economic # spec/opportunities/OPPORTUNITIES.md economic observation/discovery layer (proposal-seam law: opportunities propose, never commit)
  packages/adversarial: security # spec/adversarial/ADVERSARIAL.md INV-21 block authority + cannot_downgrade_block (escalate-only lattice)
  packages/command: platform # spec/command/COMMAND.md "Layer law" (P7-W3 platform layer)
  packages/lab: intelligence # layer examples list lab; P6-W1 no-production-financial-authority law
  packages/merchant: rails # graph.md P5-W3 payment/Stripe rail integration reusing the financial lifecycle (provider-runtime rails precedent; lane spec declares no layer — derivation recorded in LAYER-MAPPING.md)
