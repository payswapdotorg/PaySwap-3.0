<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">PaySwap Connections — guided Stripe setup concept</title>
<desc id="desc">Concept wireframe showing PaySwap navigation, a provider catalogue, a secure provider-onboarding workspace, a progress rail, and a persistent agent composer. This is not a screenshot of a working integration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e8066"/><stop offset="1" stop-color="#07966e"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#132f3f" flood-opacity=".08"/></filter>
  <style>
    .ink{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102642}
    .muted{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#5a7189}
    .tiny{font-size:12px}.small{font-size:14px}.normal{font-size:16px}.large{font-size:22px;font-weight:650}.heading{font-size:30px;font-weight:700}
    .line{stroke:#dce5e9;stroke-width:1.3}.card{fill:#fff;stroke:#dce5e9;stroke-width:1.2}.pill{fill:#e8f6f1;stroke:#bfe5d8}
  </style>
</defs>
