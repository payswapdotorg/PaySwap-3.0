<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Pay — guided dialogue to durable payment mission</title>
<desc id="desc">Eight-stage payment flow with explicit review and authorization followed by a durable running task and authoritative reconciliation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcfd"/><stop offset="1" stop-color="#eef3f5"/></linearGradient><style>
.text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102642}.muted{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#607789}.h{font-size:28px;font-weight:750}.t{font-size:16px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}.card{fill:#fff;stroke:#d3e0e6;stroke-width:1.4}.green{fill:#ecf8f2;stroke:#a6dac8;stroke-width:1.5}.amber{fill:#fff7e9;stroke:#ebd4a7;stroke-width:1.5}.line{stroke:#7a9a9b;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></defs>
<rect width="1280" height="820" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="818" rx="20" fill="none" stroke="#dce5e8"/>
<text x="42" y="55" class="text h">Pay — from intent to verified outcome</text><text x="42" y="82" class="muted s">The agent guides intake and task progress. A separate authorized financial service controls every consequential operation.</text>
<g transform="translate(42 122)">
<rect width="275" height="103" rx="14" class="card"/><circle cx="28" cy="29" r="16" fill="#e3f5ed" stroke="#a9dccb"/><text x="28" y="34" text-anchor="middle" class="text t">1</text><text x="54" y="28" class="text t">Start from any entry</text><text x="18" y="58" class="text s">Pay button, text, or voice</text><text x="18" y="79" class="muted xs">All seed the same Pay intent.</text>
<rect x="315" width="275" height="103" rx="14" class="card"/><circle cx="343" cy="29" r="16" fill="#e3f5ed" stroke="#a9dccb"/><text x="343" y="34" text-anchor="middle" class="text t">2</text><text x="369" y="28" class="text t">Gather missing facts</text><text x="333" y="58" class="text s">Amount, currency, recipient, rail</text><text x="333" y="79" class="muted xs">Deadline, fees, purpose, constraints.</text>
<rect x="630" width="275" height="103" rx="14" class="card"/><circle cx="658" cy="29" r="16" fill="#e3f5ed" stroke="#a9dccb"/><text x="658" y="34" text-anchor="middle" class="text t">3</text><text x="684" y="28" class="text t">Structure and validate</text><text x="648" y="58" class="text s">Typed payment-intent draft</text><text x="648" y="79" class="muted xs">Accounts, corridor, limits, fresh quote.</text>
<rect x="945" width="275" height="103" rx="14" class="card"/><circle cx="973" cy="29" r="16" fill="#e3f5ed" stroke="#a9dccb"/><text x="973" y="34" text-anchor="middle" class="text t">4</text><text x="999" y="28" class="text t">Show a clear preview</text><text x="963" y="58" class="text s">Destination, fee source, FX expiry</text><text x="963" y="79" class="muted xs">Route, risks, approvals, timing.</text>
<path d="M317 174H332M590 174H647M905 174H962" class="line"/><path d="M324 167l8 7-8 7M639 167l8 7-8 7M954 167l8 7-8 7" class="line"/>
<path d="M1082 225V277H1048" class="line"/><path d="M1056 269l-8 8 8 8" class="line"/>
<g transform="translate(42 278)">
<rect width="275" height="122" rx="14" class="amber"/><circle cx="28" cy="29" r="16" fill="#f6e8c8" stroke="#e6c981"/><text x="28" y="34" text-anchor="middle" class="text t">5</text><text x="54" y="28" class="text t">Explicit authorization</text><text x="18" y="58" class="text s">Review exact amount and recipient.</text><text x="18" y="80" class="text s">Approve scoped operation explicitly.</text><text x="18" y="103" class="muted xs">Voice/NLP is never approval.</text>
<rect x="315" width="275" height="122" rx="14" class="green"/><circle cx="343" cy="29" r="16" fill="#d2f0e4" stroke="#8fd0b8"/><text x="343" y="34" text-anchor="middle" class="text t">6</text><text x="369" y="28" class="text t">Create durable mission</text><text x="333" y="58" class="text s">Persist idempotency + correlation data.</text><text x="333" y="80" class="text s">Display event timeline and current stage.</text><text x="333" y="103" class="muted xs">Pause/resume after app restart.</text>
<rect x="630" width="275" height="122" rx="14" class="green"/><circle cx="658" cy="29" r="16" fill="#d2f0e4" stroke="#8fd0b8"/><text x="658" y="34" text-anchor="middle" class="text t">7</text><text x="684" y="28" class="text t">Authorized execution</text><text x="648" y="58" class="text s">Financial service calls the chosen rail.</text><text x="648" y="80" class="text s">UI remains usable; mission is resumable.</text><text x="648" y="103" class="muted xs">Safe cancellation / compensation policy.</text>
<rect x="945" width="275" height="122" rx="14" class="card"/><circle cx="973" cy="29" r="16" fill="#e3f5ed" stroke="#a9dccb"/><text x="973" y="34" text-anchor="middle" class="text t">8</text><text x="999" y="28" class="text t">Reconcile outcome</text><text x="963" y="58" class="text s">Use authoritative provider observations.</text><text x="963" y="80" class="text s">Persist evidence, timestamps, finality.</text><text x="963" y="103" class="muted xs">Ambiguous ≠ failed.</text>
</g>
<path d="M945 339H905M630 339H590M315 339H275" class="line"/><path d="M912 332l-8 7 8 7M597 332l-8 7 8 7M282 332l-8 7 8 7" class="line"/>
<g transform="translate(42 462)">
<rect width="576" height="190" rx="15" class="green"/><text x="22" y="34" class="text t">Truthful task timeline</text>
<g class="text s"><text x="26" y="68">✓ Intent recorded</text><text x="26" y="94">✓ Preview generated from real observations</text><text x="26" y="120">✓ User authorization captured</text><text x="26" y="146">• Provider / rail processing</text></g>
<path d="M8 59V147" stroke="#0f916c" stroke-width="2.2"/>
<text x="312" y="68" class="muted s">Mission remains navigable</text><text x="312" y="90" class="muted s">after route change or restart.</text><text x="312" y="126" class="muted s">A completion banner must be</text><text x="312" y="147" class="muted s">backed by verified evidence.</text>
<rect x="608" width="612" height="190" rx="15" class="amber"/><text x="630" y="34" class="text t">Outcome state is evidence-driven</text>
<rect x="630" y="52" width="170" height="43" rx="9" fill="#e5f7ee" stroke="#9ad5be"/><text x="715" y="78" text-anchor="middle" class="text s" font-weight="700">CONFIRMED</text><text x="817" y="78" class="muted xs">Authoritative confirmation recorded</text>
<rect x="630" y="105" width="170" height="43" rx="9" fill="#f8e8e8" stroke="#e8bebe"/><text x="715" y="131" text-anchor="middle" class="text s" font-weight="700">FAILED</text><text x="817" y="131" class="muted xs">Authoritative failure observed</text>
<rect x="630" y="158" width="170" height="24" rx="8" fill="#fff" stroke="#d2c08d"/><text x="715" y="174" text-anchor="middle" class="text xs" font-weight="700">UNKNOWN / RECONCILE</text><text x="817" y="174" class="muted xs">Timeout or ambiguous response; no blind retry</text>
</g>
<text x="42" y="704" class="muted xs">P13 UX reference · Illustrative flow, not a claim that payment execution is currently wired. Use sandbox evidence for sandbox claims and separate approval for live effects.</text>
</svg>